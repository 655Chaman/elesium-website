name: medium.com

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-latest-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 📋 YOUR LATEST MEDIUM POSTS 📋
        run: |
          echo "================================================================="
          echo "HERE ARE YOUR GENERATED PLAIN-TEXT BLOGS AND GUEST POSTS"
          echo "================================================================="
          
          # Find all text files generated in the last 24 hours
          files=$(find seo-automation/keyword_logs -name "*.txt" -type f -mtime -1)
          
          if [ -z "$files" ]; then
            echo "No text posts found generated recently."
          else
            for f in $files; do
              echo ""
              echo "--- FILE: $(basename "$f") ---"
              cat "$f"
              echo ""
              echo "--------------------------------------------------------"
            done
          fi

      - name: 📦 Upload Text Files as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Medium-Text-Posts
          path: seo-automation/keyword_logs/*.txt
          retention-days: 7
