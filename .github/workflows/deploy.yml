name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - run: npm install
        working-directory: ./frontend
      - run: npm run build
        working-directory: ./frontend
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          cname: elesium.online
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true

      - name: Ping Google Search Console (Sitemap)
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://elesium.online/sitemap.xml" \
            -o /dev/null -w "Google ping status: %{http_code}\n"

      - name: Ping Bing Sitemap
        run: |
          curl -s "https://www.bing.com/ping?sitemap=https://elesium.online/sitemap.xml" \
            -o /dev/null -w "Bing ping status: %{http_code}\n"

      - name: Request Google Indexing for Key Pages
        run: |
          echo "Notifying Google of updated pages..."
          pages=(
            "https://elesium.online/"
            "https://elesium.online/ai-automation"
            "https://elesium.online/ai-automation-agency-india"
            "https://elesium.online/how-we-work"
            "https://elesium.online/markets"
          )
          for page in "${pages[@]}"; do
            curl -s "https://www.google.com/ping?sitemap=${page}" \
              -o /dev/null -w "Pinged: ${page} — Status: %{http_code}\n" || true
          done
          echo "Done. Pages submitted for indexing consideration."
