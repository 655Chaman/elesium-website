name: SEO Engine Pipeline

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  seo_build_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Python dependencies
        run: |
          if [ -f "automation/requirements.txt" ]; then
            pip install -r automation/requirements.txt
          fi

      - name: Install Node dependencies
        run: |
          if [ -f "frontend/package.json" ]; then
            npm --prefix frontend install
          fi

      - name: Run SEO Autoblogger
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -f "automation/seo_autoblogger.py" ]; then
            python automation/seo_autoblogger.py
          fi

      - name: Run Link Builder
        run: |
          if [ -f "automation/link_builder.py" ]; then
            python automation/link_builder.py --latest
          fi

      - name: Build Frontend
        run: |
          if [ -d "frontend" ]; then
            npm --prefix frontend run build
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: auto-generate SEO content, syndications, and build" || echo "No changes to commit"
          git push origin main

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
