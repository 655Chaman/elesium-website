<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page Not Found | Elesium Enterprise AI</title>
  <meta name="description" content="The requested page could not be located on Elesium. Explore our enterprise AI solutions and sovereign automation architecture.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://elesium.online/404">
  <script>
    // GitHub Pages SPA redirect hack.
    // When GitHub Pages can't find a file (e.g. /signals), it serves this 404.html.
    // This script encodes the path as a query param and redirects to index.html,
    // which then decodes it and pushes it back to the React Router history.
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host + l.pathname.split('/').slice(0, 1).join('/') +
      '/?/' + l.pathname.slice(1).replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <p>Page not found. Return to <a href="/">Elesium Home</a>, explore <a href="/solutions">Enterprise AI Solutions</a>, or inspect our <a href="/commercial-directory.html">Commercial Directory</a>.</p>
</body>
</html>
